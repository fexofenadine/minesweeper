<!doctype html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <title>Minesweeper</title>
    <meta
      name="description"
      content="A free, online minesweeper game written in javascript with open source"
    />
    <meta name="keywords" content="minesweeper, game, online, free, javascript, open source" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#cbcbcb" />
    <meta property="og:title" content="Minesweeper" />
    <meta
      property="og:description"
      content="A free, online minesweeper game written in javascript with open source"
    />
    <meta property="og:url" content="https://fexofenadine.github.io/minesweeper/" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://fexofenadine.github.io/minesweeper/minesweeper.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Minesweeper" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <script>
      //apply the saved theme and window size before first paint
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'classic'
        //animated backgrounds are the default except on classic, the script corrects this once it knows the settings
        if (document.documentElement.dataset.theme !== 'classic') {
          document.documentElement.dataset.background = 'animated'
        }
        document.documentElement.style.setProperty('--scale', localStorage.getItem('scale') || 1)
      } catch {}
      //if the game fails to start, show why instead of an empty desktop
      addEventListener('error', (event) => {
        if (document.querySelector('main *')) return
        const note = document.createElement('pre')
        note.style.cssText =
          'position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0;padding:8px;background:#000;color:#fff;font:12px monospace;white-space:pre-wrap'
        note.textContent = 'Minesweeper could not start: ' + event.message
        document.body.append(note)
      })
    </script>
    <script type="module" crossorigin src="./assets/app.js?v=200cae7b"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css?v=1988d195">
  </head>
  <body>
    <div id="app">
      <main></main>
    </div>
  </body>
</html>
